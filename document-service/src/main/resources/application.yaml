server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agentflow_clients_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: super_secret_password
  bucket: agentflow-documents
  presigned-url-expiry: 600

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer